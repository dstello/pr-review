<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/primer.css">
<link rel="stylesheet" href="/assets/primer-dark.css">
<link rel="stylesheet" href="/assets/diff2html.min.css">
<style>
  /* Theme is pinned dark on #app so host-injected root theme attributes can't flip Primer's tokens. */
  html, body { height: 100%; margin: 0; background: #0d1117; }
  #app {
    height: 100%; display: flex; flex-direction: column; color-scheme: dark;
    background: var(--bgColor-default); color: var(--fgColor-default);
  }
  #app ::selection { background: var(--bgColor-accent-muted); }
  #app :focus-visible { outline: 2px solid var(--focus-outlineColor, var(--fgColor-accent)); outline-offset: -2px; }
  #bar { display: flex; gap: var(--base-size-12, 12px); align-items: center; padding: var(--base-size-8, 8px) var(--base-size-16, 16px); border-bottom: 1px solid var(--borderColor-default); }
  #bar h1 { font-size: var(--text-title-size-small, 16px); font-weight: 600; margin: 0; flex: 1; min-width: 0; }
  /* Settings menu: grouped like the github.com diff settings menu. */
  #settings .SelectMenu { right: 0; }
  #settings .SelectMenu-modal { width: 300px; }
  #settings .SelectMenu-list { padding: 4px 0; }
  #settings .menu-heading { margin: 0; padding: 8px 16px 4px; font-size: 12px; font-weight: 600; color: var(--fgColor-muted); }
  #settings hr { margin: 4px 0; border: 0; border-top: 1px solid var(--borderColor-muted); }
  /* Primer's narrow-screen rules add a border under every menu child and 16px item padding; keep one compact rhythm at every width. */
  :is(#settings, #stack) .SelectMenu-list > *, :is(#settings, #stack) .SelectMenu-item { border-bottom: 0; }
  :is(#settings, #stack) .SelectMenu-item { min-height: 32px; padding: 6px 16px; }
  :is(#settings, #stack) .SelectMenu-item:not(:disabled):hover { background: var(--control-transparent-bgColor-hover); }
  #settings .SelectMenu-item:focus-visible { outline: 2px solid var(--focus-outlineColor); outline-offset: -2px; }
  #settings .SelectMenu-item { align-items: flex-start; border-radius: 0; }
  #settings .SelectMenu-item .octicon { margin-top: 2px; }
  #settings .desc { display: block; font-size: 12px; font-weight: 400; color: var(--fgColor-muted); }
  #settings .SelectMenu-item:disabled { cursor: not-allowed; color: var(--fgColor-disabled); }
  #model-settings { display: grid; gap: 8px; padding: 4px 16px 8px; }
  #model-settings label { display: grid; gap: 4px; font-size: 12px; font-weight: 400; color: var(--fgColor-muted); }
  #model-settings select { width: 100%; }
  #model-error { margin: 0; font-size: 12px; }
  #model-error:empty { display: none; }
  /* Stack menu: top layer first, a rail joins each layer to the one below, the base branch closes the list. */
  #stack .SelectMenu-modal { width: 480px; max-height: min(70vh, 560px); }
  #stack .SelectMenu-list { padding: 4px 0; }
  .stack-item { position: relative; align-items: flex-start !important; gap: 12px; border-radius: 0; }
  .stack-item::after { content: ""; position: absolute; left: 23px; top: 29px; bottom: 3px; width: 2px; border-radius: 1px; background: var(--borderColor-default); }
  .stack-item .octicon { margin-top: 2px; }
  .stack-item > span { flex: 1; min-width: 0; }
  .stack-item b, .stack-item small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stack-item b { font-weight: 600; }
  .stack-item small { font-size: 12px; color: var(--fgColor-muted); }
  .stack-item[aria-current="page"] { background: var(--control-transparent-bgColor-selected); }
  .stack-item:hover { background: var(--control-transparent-bgColor-hover); }
  .stack-item:focus-visible { outline: 2px solid var(--focus-outlineColor); outline-offset: -2px; }
  .stack-item .s-OPEN { fill: var(--fgColor-open); } .stack-item .s-MERGED { fill: var(--fgColor-done); } .stack-item .s-CLOSED { fill: var(--fgColor-closed); }
  .stack-base { display: flex; align-items: center; gap: 12px; padding: 7px 16px; }
  .stack-base i { width: 16px; height: 16px; display: grid; place-items: center; flex: none; }
  .stack-base i::before { content: ""; width: 10px; height: 10px; border: 2px solid var(--fgColor-muted); border-radius: 50%; box-sizing: border-box; }
  #stack-error:empty { display: none; }
  .analyze-prompt { padding: 24px 16px; text-align: center; color: var(--fgColor-muted); }
  #scroller { flex: 1; overflow: auto; display: grid; grid-template-columns: var(--lw, minmax(320px, 35fr)) minmax(0, 65fr) var(--tw, 240px); align-items: start; }
  #scroller:has(#tree[hidden]) { grid-template-columns: var(--lw, minmax(320px, 35fr)) minmax(0, 65fr); }
  #left { position: relative; min-width: 0; min-height: 100%; border-right: 1px solid var(--borderColor-default); }
  #tabs { position: sticky; top: 0; z-index: 2; background: var(--bgColor-default); padding: 0 var(--base-size-16, 16px); }
  #review { position: sticky; top: var(--th, 48px); max-height: calc(var(--sh, 100vh) - var(--th, 48px)); overflow-y: auto; overscroll-behavior: contain; padding: var(--base-size-16, 16px); max-width: 72ch; }
  #review > * + * { margin-top: var(--base-size-16, 16px); }
  #review dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px var(--base-size-12, 12px); margin: 8px 0 0; }
  #review dt { color: var(--fgColor-muted); font-weight: 400; }
  #review dd { margin: 0; min-width: 0; }
  #review, #notes { overflow-wrap: anywhere; }
  #review { overflow-x: hidden; }
  #review ul { padding-left: 20px; margin: 0; }
  .loc { font: 12px var(--fontStack-monospace); color: var(--fgColor-accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .loc:hover { text-decoration: underline; }
  #notes { position: relative; padding: var(--base-size-16, 16px); }
  #tree { position: sticky; top: 0; min-width: 0; height: var(--sh, 100vh); font-size: 13px; line-height: 20px; border-left: 1px solid var(--borderColor-default); }
  #tree-body { height: 100%; overflow: auto; padding: var(--base-size-8, 8px); }
  .resizer { position: absolute; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 3; touch-action: none; }
  .resizer:hover, .resizer:focus-visible, .resizer.drag { background: var(--bgColor-accent-emphasis); outline: none; }
  #left > .resizer { right: -4px; } #tree > .resizer { left: -4px; }
  #scroller.resizing { cursor: col-resize; user-select: none; }
  /* File tree rows follow the github.com tree: 28px rows, chevron + folder, indent guides, current file selected. */
  #tree :is(summary, button) { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 28px; padding: 4px 8px; border: 0; border-radius: 6px; background: none; font: inherit; color: var(--fgColor-default); text-align: left; cursor: pointer; }
  #tree summary { list-style: none; padding-left: 4px; gap: 4px; }
  #tree summary::-webkit-details-marker { display: none; }
  #tree :is(summary, button):hover { background: var(--control-transparent-bgColor-hover); }
  #tree :is(summary, button):focus-visible { outline: 2px solid var(--focus-outlineColor); outline-offset: -2px; }
  #tree :is(summary, button) > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tree summary .chev { transition: transform 120ms cubic-bezier(0.2, 0, 0, 1); }
  #tree details:not([open]) > summary .chev { transform: rotate(-90deg); }
  #tree details:not([open]) > summary .dir-open, #tree details[open] > summary .dir-closed { display: none; }
  #tree summary .octicon:not(.chev) { fill: var(--treeViewItem-leadingVisual-iconColor-rest, var(--fgColor-muted)); }
  #tree details > div { margin-left: 11px; padding-left: 4px; border-left: 1px solid transparent; }
  #tree:hover details > div { border-left-color: var(--borderColor-muted); }
  #tree button[aria-current="true"] { background: var(--control-transparent-bgColor-selected); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { #tree summary .chev { transition: none; } }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.blocking, .dot.error { background: var(--fgColor-danger); } .dot.warning { background: var(--fgColor-attention); } .dot.info { background: var(--fgColor-accent); }
  #diff { min-width: 0; padding: var(--base-size-8, 8px); }
  /* diff2html line numbers are position:absolute; without a positioned ancestor inside #scroller they don't scroll with it. */
  #diff .d2h-file-wrapper { position: relative; margin-bottom: var(--base-size-16, 16px); border-radius: 6px; }
  #diff .d2h-code-line-ctn { tab-size: 4; }
  #diff .d2h-tag { display: none; }
  .octicon { fill: var(--fgColor-muted); flex: none; vertical-align: text-bottom; }
  #tree button.muted { color: var(--fgColor-muted); }
  #files svg { display: block; }

  /* Saved reviews menu and the empty view. */
  #reviews .SelectMenu-modal { width: 440px; max-height: min(70vh, 560px); }
  #reviews .SelectMenu-filter { display: block; }
  .review-item { display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px; border-bottom: 1px solid var(--borderColor-muted); }
  .review-item:last-child { border-bottom: 0; }
  .review-open { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-radius: 6px; cursor: pointer; }
  .review-open:hover { background: var(--bgColor-neutral-muted); }
  .review-open .octicon { margin-top: 2px; visibility: hidden; }
  .review-item[aria-checked="true"] .review-open .octicon { visibility: visible; }
  .review-open .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #app.empty #scroller, #app.empty .pr-only { display: none !important; }
  #app:not(.empty) #empty { display: none; }
  #empty .new-review { max-width: 560px; margin: 16px auto 0; }

  /* File headers and code, matched to github.com's diff view. */
  #diff .d2h-file-wrapper { border-color: var(--borderColor-default); }
  #diff .d2h-file-header {
    position: sticky; top: 0; z-index: 2; height: auto; min-height: 40px; align-items: center; gap: 4px; padding: 4px 8px 4px 4px;
    font-family: inherit; background: var(--bgColor-muted); border-bottom: 1px solid var(--borderColor-default); border-radius: 6px 6px 0 0;
  }
  #diff .d2h-file-name-wrapper { flex: 1; min-width: 0; gap: 8px; font-size: 12px; }
  #diff .d2h-file-name { font-family: var(--fontStack-monospace); font-weight: 600; color: var(--fgColor-default); }
  #diff .folded .d2h-file-header { border-bottom: 0; border-radius: 6px; }
  #diff .folded > :not(.d2h-file-header) { display: none; }
  .fold { display: flex; padding: 4px; border: 0; border-radius: 6px; background: none; cursor: pointer; }
  .fold:hover { background: var(--bgColor-neutral-muted); }
  .fold svg { transition: transform 120ms cubic-bezier(0.25, 1, 0.5, 1); }
  .folded .fold svg { transform: rotate(-90deg); }
  .diffstat { display: flex; align-items: center; gap: 1px; flex: none; font: 12px var(--fontStack-monospace); }
  .diffstat b { font-weight: 600; margin-right: 4px; }
  .diffstat i { width: 8px; height: 8px; border-radius: 2px; background: var(--bgColor-neutral-muted); }
  .diffstat i.a { background: var(--bgColor-success-emphasis); } .diffstat i.d { background: var(--bgColor-danger-emphasis); }
  .viewed { flex: none; display: flex; align-items: center; gap: 6px; font-weight: 400; }
  .viewed input { margin: 0; accent-color: var(--bgColor-accent-emphasis); }
  #diff .d2h-diff-table { font: 12px/20px var(--fontStack-monospace); }
  #diff .d2h-code-linenumber, #diff .d2h-code-side-linenumber { border: 0; padding: 0 10px; color: var(--fgColor-muted); background-color: var(--bgColor-default); }
  #diff .d2h-code-side-linenumber { width: 50px; }
  #diff .d2h-code-linenumber { width: 100px; padding: 0; }
  #diff .line-num1, #diff .line-num2 { width: 50px; padding: 0 10px; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; }
  #diff .d2h-code-side-line { padding: 0 10px 0 60px; width: calc(100% - 70px); }
  #diff .d2h-code-line { padding: 0 10px 0 110px; width: calc(100% - 120px); }
  #diff .d2h-code-line-prefix { padding-right: 8px; }
  /* Line-number cells overlay the row's translucent line color, so paint their own number color over the page background. */
  #diff td.d2h-ins:is(.d2h-code-linenumber, .d2h-code-side-linenumber) { color: var(--diffBlob-additionNum-fgColor); background-image: linear-gradient(var(--diffBlob-additionNum-bgColor) 0 0); }
  #diff td.d2h-del:is(.d2h-code-linenumber, .d2h-code-side-linenumber) { color: var(--diffBlob-deletionNum-fgColor); background-image: linear-gradient(var(--diffBlob-deletionNum-bgColor) 0 0); }
  #diff td.d2h-info:is(.d2h-code-linenumber, .d2h-code-side-linenumber) { background-color: var(--diffBlob-hunkNum-bgColor-rest); }
  #diff td.d2h-info { color: var(--diffBlob-hunkLine-fgColor); }
  #diff :is(.d2h-code-side-emptyplaceholder, .d2h-emptyplaceholder) { background-color: var(--diffBlob-emptyLine-bgColor); border-color: transparent; }
  .hunk-note { position: absolute; left: var(--base-size-16, 16px); right: var(--base-size-16, 16px); }
  .hunk-note .Box-header { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; }
  .hunk-note .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hunk-note .range { margin-left: auto; flex: none; color: var(--fgColor-muted); font: 12px var(--fontStack-monospace); font-variant-numeric: tabular-nums; }
  .hunk-note .Box-body { padding: 12px; }
  .hunk-note .summary { margin: 0; font-size: 14px; line-height: 1.5; color: var(--fgColor-default); max-width: 70ch; }
  .ask-btn { position: absolute; top: 50%; right: -10px; z-index: 2; width: 20px; height: 20px; padding: 2px; margin-top: -10px; line-height: 0; border-radius: 6px; color: var(--fgColor-onEmphasis); background: var(--bgColor-accent-emphasis); opacity: 0; transition: opacity 80ms; }
  .ask-btn:hover, .ask-btn:focus-visible { color: var(--fgColor-onEmphasis); }
  td:hover > .ask-btn, .ask-btn:focus-visible { opacity: 1; }
  #diff td.d2h-code-side-linenumber:hover, #diff td.d2h-code-side-linenumber:focus-within { overflow: visible; }
  @media (prefers-reduced-motion: reduce) { .ask-btn { transition: none; } }
  .chat-note .Box-header { color: var(--fgColor-default); }
  .chat-note .Box-header .octicon:first-child { color: var(--fgColor-accent); }
  .chat-note .chat-close { flex: none; margin: -4px -6px -4px 0; padding: 4px; }
  .chat-msgs { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
  .chat-msgs:empty { display: none; }
  .chat-msgs p { margin: 0; }
  .chat-q { align-self: flex-end; max-width: 85%; padding: 6px 10px; border-radius: 12px 12px 4px 12px; background: var(--bgColor-neutral-muted); }
  .chat-msgs .flash { padding: 8px 12px; font-size: 12px; }
  .chat-form { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px; }
  .chat-form textarea { width: 100%; min-height: 52px; resize: vertical; font-size: 13px; }
  .chat-actions { display: flex; align-items: center; gap: 8px; }
  .chat-actions select { flex: 1; min-width: 0; }
  .finding-chat { margin-top: 8px; }
  .finding-chat > summary { display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 12px; color: var(--fgColor-muted); cursor: pointer; list-style: none; border-radius: 4px; }
  .finding-chat > summary::-webkit-details-marker { display: none; }
  .finding-chat > summary:hover, .finding-chat[open] > summary { color: var(--fgColor-accent); }
  .finding-chat > summary:focus-visible { outline: 2px solid var(--focus-outlineColor); outline-offset: 2px; }
  .finding-chat .chat-msgs { margin-top: 8px; }
  .finding-chat .chat-form { padding: 8px 0 0; }
  .hunk-note .item { border-radius: 4px; transition: background-color 300ms, box-shadow 300ms; }
  .hunk-note .item.focused { background: var(--bgColor-accent-muted); box-shadow: 0 0 0 6px var(--bgColor-accent-muted), 0 0 0 7px var(--borderColor-accent-emphasis); }
  @media (prefers-reduced-motion: reduce) { .hunk-note .item { transition: none; } }
  .hunk-note .summary + .item, .hunk-note .item + .summary { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--borderColor-muted); }
  .item + .item { margin-top: var(--base-size-12, 12px); }
  .item p { margin: 4px 0 0; }
  .item .Label { margin-right: 6px; }
  #left :is(p, dd, li) strong { font-weight: 600; color: var(--fgColor-default); }
  #left :is(p, dd, li) u { text-decoration-color: var(--fgColor-muted); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  #left :is([data-sev="blocking"], [data-sev="error"]) u { text-decoration-color: var(--fgColor-danger); }
  #left [data-sev="warning"] u { text-decoration-color: var(--fgColor-attention); }

  /* diff2html dark scheme → Primer diffBlob tokens */
  #app .d2h-dark-color-scheme {
    --d2h-dark-bg-color: var(--bgColor-default);
    --d2h-dark-color: var(--fgColor-default);
    --d2h-dark-border-color: var(--borderColor-default);
    --d2h-dark-dim-color: var(--fgColor-muted);
    --d2h-dark-line-border-color: var(--borderColor-muted);
    --d2h-dark-file-header-bg-color: var(--bgColor-muted);
    --d2h-dark-file-header-border-color: var(--borderColor-default);
    --d2h-dark-empty-placeholder-bg-color: var(--diffBlob-emptyLine-bgColor);
    --d2h-dark-empty-placeholder-border-color: var(--borderColor-muted);
    --d2h-dark-ins-bg-color: var(--diffBlob-additionLine-bgColor);
    --d2h-dark-ins-border-color: var(--diffBlob-additionNum-bgColor);
    --d2h-dark-ins-highlight-bg-color: var(--diffBlob-additionWord-bgColor);
    --d2h-dark-ins-label-color: var(--fgColor-success);
    --d2h-dark-del-bg-color: var(--diffBlob-deletionLine-bgColor);
    --d2h-dark-del-border-color: var(--diffBlob-deletionNum-bgColor);
    --d2h-dark-del-highlight-bg-color: var(--diffBlob-deletionWord-bgColor);
    --d2h-dark-del-label-color: var(--fgColor-danger);
    --d2h-dark-info-bg-color: var(--diffBlob-hunkLine-bgColor);
    --d2h-dark-info-border-color: var(--borderColor-muted);
    --d2h-dark-change-label-color: var(--fgColor-attention);
    --d2h-dark-change-ins-color: var(--diffBlob-additionLine-bgColor);
    --d2h-dark-change-del-color: var(--diffBlob-deletionLine-bgColor);
    --d2h-dark-moved-label-color: var(--fgColor-accent);
    --d2h-dark-selected-color: var(--bgColor-accent-muted);
  }
  #app .d2h-code-line, #app .d2h-code-side-line, #app .d2h-code-linenumber, #app .d2h-code-side-linenumber { font-family: var(--fontStack-monospace); }

  /* highlight.js tokens → Primer prettylights syntax colors */
  #diff .hljs-comment, #diff .hljs-quote { color: var(--color-prettylights-syntax-comment); }
  #diff .hljs-keyword, #diff .hljs-selector-tag, #diff .hljs-type, #diff .hljs-template-tag, #diff .hljs-meta .hljs-keyword { color: var(--color-prettylights-syntax-keyword); }
  #diff .hljs-string, #diff .hljs-regexp, #diff .hljs-meta .hljs-string { color: var(--color-prettylights-syntax-string); }
  #diff .hljs-number, #diff .hljs-literal, #diff .hljs-attr, #diff .hljs-attribute, #diff .hljs-variable.constant_, #diff .hljs-built_in, #diff .hljs-selector-attr, #diff .hljs-selector-class, #diff .hljs-selector-id, #diff .hljs-symbol { color: var(--color-prettylights-syntax-constant); }
  #diff .hljs-title, #diff .hljs-title.function_, #diff .hljs-title.class_, #diff .hljs-section { color: var(--color-prettylights-syntax-entity); }
  #diff .hljs-name, #diff .hljs-tag, #diff .hljs-selector-pseudo { color: var(--color-prettylights-syntax-entity-tag); }
  #diff .hljs-variable, #diff .hljs-params, #diff .hljs-subst, #diff .hljs-template-variable { color: var(--color-prettylights-syntax-storage-modifier-import); }
  #diff .hljs-meta { color: var(--color-prettylights-syntax-meta, var(--color-prettylights-syntax-constant)); }
  #diff .hljs-bullet { color: var(--color-prettylights-syntax-markup-list); }
  #diff .hljs-emphasis { font-style: italic; } #diff .hljs-strong { font-weight: 600; }
  #diff .hljs-addition { color: var(--color-prettylights-syntax-markup-inserted-text); }
  #diff .hljs-deletion { color: var(--color-prettylights-syntax-markup-deleted-text); }
</style>
</head>
<body>
<div id="app" data-color-mode="dark" data-dark-theme="dark" data-light-theme="dark">
  <div id="bar">
    <details id="reviews" class="details-reset details-overlay position-relative">
      <summary class="btn btn-sm" aria-haspopup="true"><span id="reviews-icon"></span> Reviews <span id="review-count" class="Counter"></span> <span class="dropdown-caret"></span></summary>
      <div class="SelectMenu"><div class="SelectMenu-modal">
        <header class="SelectMenu-header"><h3 class="SelectMenu-title">New review</h3></header>
        <div class="SelectMenu-filter">
          <form class="new-review d-flex" style="gap:8px"><input name="pr" class="form-control input-sm flex-1" type="text" placeholder="https://github.com/owner/repo/pull/123" aria-label="Pull request URL" autocomplete="off" required><button class="btn btn-sm btn-primary" type="submit">Start review</button></form>
          <p class="new-error color-fg-danger f6 mt-2 mb-0" hidden></p>
        </div>
        <div class="SelectMenu-divider">Saved reviews</div>
        <div id="review-list" class="SelectMenu-list" role="menu"></div>
      </div></div>
    </details>
    <details id="stack" class="details-reset details-overlay position-relative pr-only" hidden>
      <summary class="btn btn-sm" aria-haspopup="menu"><span id="stack-icon"></span> <span id="stack-pos"></span></summary>
      <div class="SelectMenu"><div class="SelectMenu-modal">
        <header class="SelectMenu-header"><h3 id="stack-title" class="SelectMenu-title"></h3><button class="SelectMenu-closeButton" type="button" aria-label="Close the stack menu"><span id="stack-close"></span></button></header>
        <div id="stack-list" class="SelectMenu-list" role="menu" aria-labelledby="stack-title"></div>
        <p id="stack-error" class="color-fg-danger f6 px-3 py-2 m-0" role="status"></p>
        <footer class="SelectMenu-footer">Use <kbd>⇧ J</kbd> <kbd>⇧ K</kbd> to move down and up the stack</footer>
      </div></div>

function renderDiff() {
  for (const [format, el] of Object.entries(diffPanes)) el.hidden = format !== view.format;
  if (diffPanes[view.format]) return applyFiles();
  const pane = diffPanes[view.format] = $("diff").appendChild(document.createElement("div"));
  const ui = new Diff2HtmlUI(pane, state.diff, {
    drawFileList: false, outputFormat: view.format, matching: "lines", highlight: true,
    colorScheme: "dark", synchronisedScroll: true, fileContentToggle: false,
  });
  ui.draw();
  wrappers().forEach((w, fi) => {
    const hd = w.querySelector(".d2h-file-header");
    w.dataset.fi = fi;
    w.hunkRows = [...(w.querySelector(".d2h-file-side-diff") ?? w).querySelectorAll("tbody tr")].filter((tr) => tr.querySelector("td.d2h-info"));
    hd.querySelector("svg.d2h-icon")?.remove();
    hd.insertAdjacentHTML("afterbegin", `<button class="fold" type="button">${ICON.chevron}</button>`);
    hd.querySelector(".d2h-file-name").insertAdjacentHTML("afterend", diffstat(files[fi]));
    hd.insertAdjacentHTML("beforeend", `<label class="viewed btn btn-sm"><input type="checkbox"> Viewed</label>`);
  });
  applyFiles();
}

function diffstat(f) {
  const { add: a, del: d } = f;
  let g = Math.round((a / (a + d || 1)) * 5);
  if (a && !g) g = 1;
  if (d && g === 5) g = 4;
  const r = a + d ? 5 - g : 0;
  const blocks = "a".repeat(g) + "d".repeat(r) + "n".repeat(5 - g - r);
  return `<span class="diffstat" aria-label="${a} lines added, ${d} lines removed"><b class="color-fg-success">+${a}</b><b class="color-fg-danger">−${d}</b>${[...blocks].map((c) => `<i class="${c}"></i>`).join("")}</span>`;
}

function applyFiles() {
  wrappers().forEach((w) => {
    const fi = +w.dataset.fi, path = files[fi].path, fold = folded.has(path);
    w.hidden = !shown(fi);
    w.classList.toggle("folded", fold);
    w.querySelector(".fold").setAttribute("aria-expanded", !fold);
    w.querySelector(".fold").setAttribute("aria-label", `${fold ? "Unfold" : "Fold"} ${path}`);
    w.querySelector(".viewed input").checked = viewed.has(path);
  });
  queueLayout();
}

$("diff").addEventListener("click", (e) => {
  const w = e.target.closest(".d2h-file-wrapper");
  if (!w || !e.target.closest(".fold")) return;
  const path = files[w.dataset.fi].path;
  folded.has(path) ? folded.delete(path) : folded.add(path);
  applyFiles();
});
$("diff").addEventListener("change", (e) => {
  const w = e.target.closest(".d2h-file-wrapper");
  if (!w || !e.target.matches(".viewed input")) return;
  const path = files[w.dataset.fi].path;
  for (const set of [viewed, folded]) e.target.checked ? set.add(path) : set.delete(path);
  localStorage.setItem(VIEWED_KEY, JSON.stringify([...viewed]));
  applyFiles();
  if (w.getBoundingClientRect().top < $("scroller").getBoundingClientRect().top) w.scrollIntoView({ block: "start" });
});

function renderTree() {
  const root = {};
  files.forEach((f, i) => {
    const parts = f.path.split("/");
    let node = root;
    for (const p of parts.slice(0, -1)) node = node[p + "/"] ??= {};
    node[parts.at(-1)] = i;
  });
  const sev = (i) => {
    const s = new Set((state.review?.findings ?? []).filter((x) => x.fi === i).map((x) => x.severity));
    return SEV_ORDER.find((x) => s.has(x));
  };
  // Merge folders that have only one child folder, as on github.com (packages/dashboard-surface).
  const compact = (node) => Object.fromEntries(Object.entries(node).map(([name, v]) => {
    if (typeof v === "number") return [name, v];
    while (Object.keys(v).length === 1 && typeof Object.values(v)[0] !== "number") { const [k] = Object.keys(v); name += k; v = v[k]; }
    return [name, compact(v)];
  }));
  const icon = (cls, s) => s.replace('class="octicon"', `class="octicon ${cls}"`);
  const walk = (node, dir = "") => Object.entries(node).sort(([a, x], [b, y]) => (typeof x === "number") - (typeof y === "number") || a.localeCompare(b))
    .map(([name, v]) => {
      if (typeof v === "number") {
        const s = sev(v);
        return `<button type="button" data-fi="${v}" ${shown(v) ? `title="${esc(files[v].path)}">${ICON.file}` : `class="muted" title="${esc(files[v].path)} is hidden. Select it to show test files.">${ICON.eyeClosed}`}<span>${esc(name)}</span>`
          + (s ? `<i class="dot ${s}" role="img" aria-label="${SEV_NAME[s]} finding"></i>` : "") + `</button>`;
      }
      const path = dir + name;
      return `<details data-dir="${esc(path)}"${closedDirs.has(path) ? "" : " open"}><summary title="${esc(path.slice(0, -1))}">${icon("chev", ICON.chevron)}${icon("dir-open", ICON.dirOpen)}${icon("dir-closed", ICON.dir)}<span>${esc(name.slice(0, -1))}</span></summary><div>${walk(v, path)}</div></details>`;
    }).join("");
  $("tree-body").innerHTML = walk(compact(root));
  markCurrentFile();
}
// Folder open/closed state survives re-renders when the review updates.
const closedDirs = new Set();
$("tree-body").addEventListener("toggle", (e) => {
  const d = e.target.dataset?.dir;
  if (d != null) e.target.open ? closedDirs.delete(d) : closedDirs.add(d);
}, true);

// Select the file at the top of the diff in the tree, as github.com does.
let currentFi = -1;
function markCurrentFile() {
  const top = $("scroller").getBoundingClientRect().top + 1;
  const w = [...wrappers()].find((x) => !x.hidden && x.getBoundingClientRect().bottom > top);
  const fi = w ? +w.dataset.fi : -1;
  const prev = $("tree-body").querySelector('[aria-current="true"]');
  const btn = $("tree-body").querySelector(`button[data-fi="${fi}"]`);
  if (prev === btn && fi === currentFi) return;
  currentFi = fi;
  prev?.removeAttribute("aria-current");
  btn?.setAttribute("aria-current", "true");
  btn?.scrollIntoView({ block: "nearest" });
}
let spyFrame = 0;
$("scroller").addEventListener("scroll", () => { spyFrame ||= requestAnimationFrame(() => { spyFrame = 0; markCurrentFile(); }); }, { passive: true });

const scrollToFile = (fi) => wrappers()[fi]?.scrollIntoView({ block: "start" });
$("tree").addEventListener("click", (e) => {
  const fi = e.target.closest("button")?.dataset.fi;
  if (fi == null) return;
  if (!shown(fi)) setTests(false);
  scrollToFile(fi);
});

const LABEL = { blocking: "Label--danger", error: "Label--danger", warning: "Label--attention", info: "Label--accent" };
const SEV_NAME = { blocking: "Blocking", error: "Error", warning: "Warning", info: "Info" };
const SEV_ORDER = ["blocking", "error", "warning", "info"];
const sevLabel = (x) => `<span class="Label ${LABEL[x.severity] ?? ""}">${SEV_NAME[x.severity] ?? esc(x.severity)}</span>`;
const loc = (x) => {
  const text = `${esc(x.file)}${x.line ? `:${x.line}` : ""}`;
  return x.fi >= 0 ? `<button class="loc" type="button" data-fi="${x.fi}" data-i="${state.review.findings.indexOf(x)}">${text}</button>` : `<code class="color-fg-muted f6">${text}</code>`;
};
// Older cached reviews used { title, detail }; newer ones follow the /pr-review finding bar.
const body = (x) => x.scenario ? `${md(x.scenario)} ${md(x.impact)}` : md(x.detail);

function findingHtml(x) {
  const i = state.review.findings.indexOf(x);
  return `<div class="item${i === focused ? " focused" : ""}" data-i="${i}" data-sev="${esc(x.severity)}">${sevLabel(x)}<strong>${md(x.title)}</strong>${x.line ? ` <span class="color-fg-muted f6">L${x.line}</span>` : ""}`
    + `<p>${body(x)}</p>${x.fix ? `<p><span class="color-fg-muted">Fix:</span> ${md(x.fix)}</p>` : ""}<div class="finding-chat-slot" data-i="${i}"></div></div>`;
}

function hunkCoverage() {
  const c = state.coverage;
  return c && c.hunks > c.maxHunks ? `<div class="flash flash-warn">The analysis explains only the first ${c.maxHunks} of ${c.hunks} hunks. The other hunks have no explanation.</div>` : "";
}
function reviewCoverage() {
  const c = state.coverage;
  return c?.reviewTruncated ? `<div class="flash flash-warn">The diff is too large. The review covers only the first ${c.maxReviewChars.toLocaleString("en-US")} characters.</div>` : "";
}

function renderReview() {
  syncChats();
  const r = state.review, active = saveFocus();
  const error = (state.error ? `<div class="flash flash-error">The analysis failed: ${esc(state.error)}</div>` : "") + saveWarning() + reviewCoverage() + hunkCoverage();
  if (!r) {
    $("review").innerHTML = error + (state.status === "idle" ? ANALYZE_PROMPT : error ? "" : state.status === "running"
      ? `<p class="color-fg-muted">${esc(state.models?.reviewModel)} is reviewing the pull request<span class="AnimatedEllipsis"></span></p>`
      : `<p class="color-fg-muted">No review is available. Choose Analyze again in the settings menu to start a review.</p>`);
    return;
  }
  const findings = [...r.findings].sort((a, b) => SEV_ORDER.indexOf(a.severity) - SEV_ORDER.indexOf(b.severity));
  const row = (x) => `<div class="Box-row" data-sev="${esc(x.severity)}"><div class="d-flex flex-items-center flex-wrap" style="gap:6px">${sevLabel(x)}${x.category ? `<span class="Label">${esc(x.category)}</span>` : ""}<strong>${md(x.title)}</strong></div>`
    + `<div class="mt-1">${loc(x)}</div>`
    + (x.scenario
      ? `<dl><dt>Scenario</dt><dd>${md(x.scenario)}</dd><dt>Impact</dt><dd>${md(x.impact)}</dd><dt>Evidence</dt><dd>${md(x.evidence)}</dd><dt>Fix</dt><dd>${md(x.fix)}</dd></dl>`
      : `<p class="mt-2 mb-0">${md(x.detail)}</p>`)
    + `<div class="finding-chat-slot" data-i="${r.findings.indexOf(x)}"></div></div>`;
  $("review").innerHTML = error
    + `<div class="Box"><div class="Box-header d-flex flex-items-center"><h2 class="Box-title flex-1">Review</h2><span class="color-fg-muted f6">${esc(state.models?.reviewModel)}</span></div>`
    + `<div class="Box-body"><dl class="mt-0"><dt>Intent</dt><dd>${md(r.intent) || "—"}</dd><dt>Approach</dt><dd>${md(r.approach) || "—"}</dd></dl></div></div>`
    + `<div class="Box"><div class="Box-header"><h2 class="Box-title">Findings <span class="Counter">${findings.length}</span></h2></div>`
    + (findings.length ? findings.map(row).join("") : `<div class="Box-body color-fg-muted">The review found no confirmed problems.</div>`) + `</div>`
    + (r.openQuestions?.length ? `<div><h3 class="f5 mb-2">Open questions</h3><ul>${r.openQuestions.map((q) => `<li>${md(q)}</li>`).join("")}</ul></div>` : "")
    + `<div><h3 class="f5 mb-2">Summary of risks</h3><p class="mb-0">${md(r.bottomLine ?? r.overview)}</p></div>`;
  mountFindingChats($("review"), "review", active);
}

// A finding link opens the Code tab and highlights that finding next to its hunk.
let focused = -1, focusTimer = 0;
$("review").addEventListener("click", (e) => {
  const link = e.target.closest(".loc");
  if (!link) return;
  const fi = +link.dataset.fi;
  if (!shown(fi)) setTests(false);
  if (folded.delete(files[fi].path)) applyFiles();
  focused = +link.dataset.i;
  setTab("code");
  layoutNotes();
  const item = $("notes").querySelector(`.item[data-i="${focused}"]`);
  item ? item.closest(".hunk-note").scrollIntoView({ block: "center" }) : scrollToFile(fi);
  clearTimeout(focusTimer);
  focusTimer = setTimeout(() => { focused = -1; $("notes").querySelector(".item.focused")?.classList.remove("focused"); }, 2500);
});

// Anchor each hunk's notes next to its @@ row in the diff; cards are pushed down when they'd overlap.
function layoutNotes() {
  const notesEl = $("notes");
  const active = saveFocus();
  const groups = new Map();
  const add = (fi, hi, html, line = 0) => {
    const k = `${fi}:${hi}:${line}`;
    if (!groups.has(k)) groups.set(k, { fi, hi, line, html: [] });
    groups.get(k).html.push(html);
  };
  for (const [k, n] of Object.entries(state.notes ?? {})) {
    if (n.trivial) continue;
    const [fi, hi] = k.split(":").map(Number);
    if (!isOpen(fi)) continue;
    add(fi, hi, `<p class="summary">${md(hunkSummary(n.summary))}</p><div class="hunk-chat-slot" data-fi="${fi}" data-hi="${hi}"></div>`);
  }
  const findings = state.review?.findings ?? [];
  for (const x of findings) if (x.fi >= 0 && isOpen(x.fi)) add(x.fi, x.hi, findingHtml(x), x.line > 0 ? x.line : 0);
  $("code-count").textContent = findings.length || "";

  const unplaced = findings.filter((x) => x.fi < 0);
  const top = (state.status === "idle" ? ANALYZE_PROMPT : "") + saveWarning() + hunkCoverage() + (unplaced.length
    ? `<div class="Box mb-3"><div class="Box-header"><h2 class="Box-title">Findings outside a hunk</h2></div>${unplaced.map((x) => `<div class="Box-row">${findingHtml(x)}</div>`).join("")}</div>`
    : "");
  syncChats();
  $("notes-top").innerHTML = top;
  if (notesEl.hidden) { $("notes-cards").innerHTML = ""; return; }

  // Read every anchor position, write all cards once, read all card heights, then write their positions.
  const ws = wrappers();
  const base = notesEl.getBoundingClientRect().top;
  const anchors = [...groups.values()].map((g) => {
    const w = ws[g.fi];
    if (!w) return null;
    // Findings anchor to their own line; hunk notes, and lines not shown in the diff, anchor to the @@ row.
    const row = g.line ? rowFor({ fi: g.fi, side: "new", line: g.line }) : null;
    if (!row) g.line = 0;
    const el = row ?? (g.hi >= 0 ? w.hunkRows[g.hi] ?? w : w);
    return { ...g, top: el.getBoundingClientRect().top - base };
  }).filter(Boolean).sort((a, b) => a.top - b.top);

  $("notes-cards").innerHTML = anchors.map((a) => {
    const f = files[a.fi], h = f.hunks[a.hi];
    return `<div class="hunk-note Box"><div class="Box-header" title="${esc(f.path)}">${ICON.file}<span class="name">${esc(f.path.split("/").pop())}</span>${a.line ? `<span class="range">L${a.line}</span>` : h ? `<span class="range">${h.start === h.end ? `L${h.start}` : `L${h.start}–${h.end}`}</span>` : ""}</div>`
      + `<div class="Box-body">${a.html.join("")}</div></div>`;
  }).join("");
  mountFindingChats(notesEl, "code", active);
  const items = [...$("notes-cards").children].map((el, i) => ({ el, top: anchors[i].top }));
  for (const el of chatEls.values()) {
    const row = rowFor(el.thread);
    el.hidden = !row;
    if (row) items.push({ el, top: row.getBoundingClientRect().top - base, chat: true });
  }
  items.sort((a, b) => a.top - b.top || (a.chat ?? 0) - (b.chat ?? 0));
  const topEl = $("notes-top");
  let floor = topEl.offsetTop + topEl.offsetHeight + (top ? 8 : 0);
  const heights = items.map((x) => x.el.offsetHeight);
  items.forEach((x, i) => {
    const y = Math.max(x.top, floor);
    x.el.style.top = y + "px";
    floor = y + heights[i] + 8;
  });
  notesEl.style.minHeight = floor + "px";
}

// Line chat: the Copilot button on a line number opens a chat card next to that line.
const askBtn = Object.assign(document.createElement("button"), { type: "button", className: "ask-btn btn-octicon", innerHTML: ICON.copilot, title: "Ask Copilot about this line" });
askBtn.setAttribute("aria-label", "Ask Copilot about this line");
function lineAt(cell) {
  const w = cell?.closest(".d2h-file-wrapper");
  if (!w || cell.classList.contains("d2h-info")) return null;
  let side, line;
  if (cell.matches(".d2h-code-linenumber")) {
    const n2 = cell.querySelector(".line-num2")?.textContent.trim();
    [side, line] = n2 ? ["new", n2] : ["old", cell.querySelector(".line-num1")?.textContent.trim()];
  } else {
    side = cell.closest(".d2h-file-side-diff") === w.querySelector(".d2h-file-side-diff") ? "old" : "new";
    line = cell.textContent.trim();
  }
  return +line > 0 ? { fi: +w.dataset.fi, side, line: +line } : null;
}
function rowFor({ fi, side, line }) {
  const w = wrappers()[fi];
  if (!w || w.hidden || w.classList.contains("folded")) return null;
  const sides = w.querySelectorAll(".d2h-file-side-diff");
  const cells = sides.length ? sides[side === "old" ? 0 : 1].querySelectorAll("td.d2h-code-side-linenumber") : w.querySelectorAll(`.line-num${side === "old" ? 1 : 2}`);
  for (const c of cells) if (+c.textContent.trim() === line) return c.closest("tr");
  return null;
}
$("diff").addEventListener("mouseover", (e) => {
  const cell = e.target.closest("td.d2h-code-linenumber, td.d2h-code-side-linenumber");
  if (cell && cell !== askBtn.parentElement && lineAt(cell)) cell.append(askBtn);
});
askBtn.onclick = (e) => {
  e.stopPropagation();
  const a = lineAt(askBtn.parentElement);
  if (a) openChat(a);
};

const chatEls = new Map(); // thread id → card element; kept across layouts so drafts and focus survive
const chatModel = () => $("hunk-model").disabled ? state.models?.hunkModel : $("hunk-model").value || state.models?.hunkModel;
function fillChatModel(sel, selected) {
  const choices = catalog.length ? modelChoices(catalog, "hunkModel", selected) : [];
  sel.innerHTML = (choices.some((m) => m.id === selected) ? "" : `<option value="${esc(selected)}">${esc(selected)}</option>`)
    + choices.map((m) => `<option value="${esc(m.id)}">${esc(m.name ?? m.id)}</option>`).join("");
  sel.value = selected;
}
function createChat(t) {
  const el = document.createElement("div");
  el.className = "hunk-note chat-note Box";
  el.innerHTML = `<div class="Box-header" title="${esc(t.path)}">${ICON.copilot}<span class="name">${esc(t.path.split("/").pop())}</span><span class="range">${t.side === "old" ? "Old " : ""}L${t.line}</span>`
    + `<button class="chat-close btn-octicon" type="button" aria-label="Close the chat about line ${t.line}">${ICON.x}</button></div>`
    + `<div class="Box-body chat-msgs" aria-live="polite"></div>` + chatForm("Box-footer", `Ask Copilot about line ${t.line}`);
  wireChat(el, t);
  el.querySelector(".chat-close").onclick = async () => {
    if (!el.draft) {
      try { await api(`/api/ask?${q}&thread=${encodeURIComponent(el.thread.id)}`, { method: "DELETE" }); } catch (x) {
        return updateChat(el, { ...el.thread, error: x.message });
      }
    }
    el.remove();
    chatEls.delete(el.thread.id);
    queueLayout();
  };
  $("notes-chats").append(el);
  chatEls.set(t.id, el);
  updateChat(el, t);
  return el;
}
const chatForm = (cls, label) => `<form class="${cls} chat-form"><textarea class="form-control" name="question" rows="2" placeholder="${esc(label)}" aria-label="${esc(label)}"></textarea>`
  + `<div class="chat-actions"><select class="form-select select-sm" name="model" aria-label="Model"></select><button class="btn btn-sm btn-primary" type="submit">Ask</button></div></form>`;
const newId = () => crypto.randomUUID?.() ?? Date.now().toString(36) + Math.random().toString(36).slice(2);
function wireChat(el, t) {
  const form = el.querySelector("form");
  fillChatModel(form.model, t.model ?? chatModel());
  form.model.onchange = () => updateChat(el, el.thread);
  form.question.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } };
  // Inline chats re-render with their card, so only line chats re-layout while typing.
  if (el.classList.contains("chat-note")) form.question.oninput = queueLayout;
  form.onsubmit = async (e) => {
    e.preventDefault();
    const question = form.question.value.trim(), t = el.thread;
    if (!question || t.status === "running" || el.querySelector("button[type=submit]").disabled) return;
    form.question.value = "";
    updateChat(el, { ...t, model: form.model.value, status: "running", error: null, messages: [...t.messages, { role: "user", text: question }] });
    try {
      await api(`/api/ask?${q}`, { method: "POST", body: JSON.stringify({ thread: t.id, fi: t.fi, hi: t.hi, line: t.line, side: t.side, finding: t.finding, question, model: form.model.value }) });
      el.draft = false;
    } catch (x) {
      form.question.value ||= question;
      updateChat(el, { ...t, status: "error", error: x.message });
    }
  };
}
// Finding chats live in a collapsed <details> under each finding. The element persists across
// layouts (cards are re-rendered) so the open state and draft text survive.
// The Review and Code tabs each get their own element for a finding; both show the same thread.
const findingChats = new Map(); // "code:3" / "review:3" → <details>
const hunkChats = new Map();
let findingsKey = "";
const saveFocus = () => {
  const el = document.activeElement;
  return el?.closest?.(".finding-chat") ? { el, sel: [el.selectionStart, el.selectionEnd] } : null;
};
function mountFindingChats(root, scope, active) {
  for (const slot of root.querySelectorAll(".finding-chat-slot")) slot.replaceWith(findingChat(+slot.dataset.i, scope));
  for (const slot of root.querySelectorAll(".hunk-chat-slot")) slot.replaceWith(hunkChat(+slot.dataset.fi, +slot.dataset.hi));
  if (active?.el.isConnected && document.activeElement !== active.el) {
    active.el.focus({ preventScroll: true });
    if (active.sel[0] != null) active.el.setSelectionRange(...active.sel);
  }
}
function findingChat(i, scope) {
  let el = findingChats.get(`${scope}:${i}`);
  if (el) return el;
  const t = state.chats?.find((c) => c.finding === i) ?? { id: `finding-${i}`, finding: i, messages: [] };
  el = createInlineChat(t, "finding");
  findingChats.set(`${scope}:${i}`, el);
  return el;
}
function hunkChat(fi, hi) {
  const key = `${fi}:${hi}`;
  let el = hunkChats.get(key);
  if (el) return el;
  const t = state.chats?.find((c) => c.fi === fi && c.hi === hi) ?? { id: `hunk-${fi}-${hi}`, fi, hi, messages: [] };
  el = createInlineChat(t, "explanation");
  hunkChats.set(key, el);
  return el;
}
function createInlineChat(t, subject) {
  const el = document.createElement("details");
  el.className = "finding-chat";
  el.innerHTML = `<summary>${ICON.copilot}Ask Copilot</summary><div class="chat-msgs" aria-live="polite"></div>` + chatForm("", `Ask Copilot about this ${subject}`);
  el.draft = !t.messages.length;
  el.open = !el.draft;
  el.ontoggle = () => { if (el.open) el.querySelector("textarea").focus({ preventScroll: true }); queueLayout(); };
  wireChat(el, t);
  updateChat(el, t);
  return el;
}
function updateChat(el, t) {
  el.thread = t;
  const html = t.messages.map((m) => m.role === "user" ? `<div class="chat-q">${md(m.text)}</div>` : `<div class="chat-a">${md(m.text)}</div>`).join("")
    + (t.status === "running" ? `<p class="color-fg-muted f6">${esc(t.model)} is answering<span class="AnimatedEllipsis"></span></p>` : "")
    + (t.error ? `<div class="flash flash-error">The question failed: ${esc(t.error)}</div>` : "");
  const msgs = el.querySelector(".chat-msgs");
  if (msgs.innerHTML !== html) { msgs.innerHTML = html; msgs.scrollTop = msgs.scrollHeight; }
  const model = el.querySelector("select").value;
  el.querySelector("button[type=submit]").disabled = t.status === "running" || !!modelLoadError || !catalog.some((m) => m.id === model);
}
function syncChats() {
  const threads = state.chats ?? [];
  for (const key of hunkChats.keys()) if (!state.notes?.[key]) hunkChats.delete(key);
  const k = JSON.stringify(state.review?.findings ?? []);
  if (k !== findingsKey) { findingsKey = k; findingChats.clear(); }
  for (const t of threads) {
    if (t.hi != null) {
      const el = hunkChats.get(`${t.fi}:${t.hi}`);
      if (el) { el.draft = false; updateChat(el, t); }
      continue;
    }
    if (t.finding != null) {
      for (const el of findingChats.values()) if (el.thread.finding === t.finding) { el.draft = false; updateChat(el, t); }
      continue;
    }
    const el = chatEls.get(t.id);
    if (!el) createChat(t);
    else { el.draft = false; updateChat(el, t); }
  }
  for (const [id, el] of chatEls) if (!el.draft && !threads.some((t) => t.id === id)) { el.remove(); chatEls.delete(id); }
}
function openChat(a) {
  setTab("code");
  let el = [...chatEls.values()].find(({ thread: t }) => t.fi === a.fi && t.side === a.side && t.line === a.line);
  if (!el) {
    el = createChat({ id: newId(), ...a, path: files[a.fi].path, messages: [] });
    el.draft = true;
  }
  layoutNotes();
  el.querySelector("textarea").focus({ preventScroll: true });
}

function setTab(tab) {
  localStorage.setItem("prr-tab", tab);
  $("tab-review").setAttribute("aria-selected", tab === "review");
  $("tab-code").setAttribute("aria-selected", tab === "code");
  $("review").hidden = tab !== "review";
  $("notes").hidden = tab !== "code";
  if (state) queueLayout();
}
$("tab-review").onclick = () => setTab("review");
$("tab-code").onclick = () => setTab("code");

function setTree(open) {
  localStorage.setItem("prr-tree", open ? "1" : "0");
  $("tree").hidden = !open;
  const label = open ? "Hide file tree" : "Show file tree";
  $("files").setAttribute("aria-expanded", open);
  $("files").setAttribute("aria-label", label);

}
$("files").onclick = () => setTree($("tree").hidden);

// Drag or use the arrow keys on a gutter to resize a pane. Double-click resets it.
const PANE = { left: { v: "--lw", min: 320 }, tree: { v: "--tw", min: 140 } };
function setPane(pane, px, persist = true) {
  const sc = $("scroller"), other = pane === "left" ? ($("tree").hidden ? 0 : $("tree").offsetWidth) : $("left").offsetWidth;
  const w = px == null ? null : Math.round(Math.max(PANE[pane].min, Math.min(px, sc.clientWidth - other - 320)));
  w == null ? sc.style.removeProperty(PANE[pane].v) : sc.style.setProperty(PANE[pane].v, w + "px");
  if (persist) w == null ? localStorage.removeItem("prr-w-" + pane) : localStorage.setItem("prr-w-" + pane, w);
  if (state) queueLayout();
}
const paneWidth = (pane) => (pane === "left" ? $("left") : $("tree")).offsetWidth;
document.querySelectorAll(".resizer").forEach((g) => {
  const pane = g.dataset.pane, sc = $("scroller");
  g.onpointerdown = (e) => {
    g.setPointerCapture(e.pointerId); g.classList.add("drag"); sc.classList.add("resizing");
    g.onpointermove = (m) => setPane(pane, pane === "left" ? m.clientX - sc.getBoundingClientRect().left : sc.getBoundingClientRect().right - m.clientX, false);
  };
  g.onpointerup = () => {
    if (g.onpointermove) localStorage.setItem("prr-w-" + pane, paneWidth(pane));
    g.onpointermove = null; g.classList.remove("drag"); sc.classList.remove("resizing");
  };
  g.ondblclick = () => setPane(pane, null);
  g.onkeydown = (e) => {
    const d = { ArrowLeft: -16, ArrowRight: 16 }[e.key];
    if (d) { e.preventDefault(); setPane(pane, paneWidth(pane) + (pane === "left" ? d : -d)); }
  };
});

function renderHeader() {
  const m = state.meta;
  $("title").innerHTML = `${esc(m.title)} <span class="color-fg-muted text-normal"><a class="Link--secondary" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(key)}</a> · ${esc(m.headRefName)} → ${esc(m.baseRefName)}</span>`;
  $("status").innerHTML = state.status === "running"
    ? `Analyzing <span class="Counter">${state.progress.done}/${state.progress.total}</span>`
    : state.status === "error" ? `<span class="color-fg-danger">The analysis failed</span>`
    : state.status === "idle" ? "Not analyzed" : "";
  $("rerun").disabled = state.status === "running";
  $("rerun-label").textContent = state.status === "idle" ? "Analyze" : "Analyze again";
}

function setFormat(format) {
  view.format = format;
  localStorage.setItem("prr-format", format);
  $("split").setAttribute("aria-checked", format === "side-by-side");
  $("unified").setAttribute("aria-checked", format === "line-by-line");
  renderDiff();
}
const closeMenu = (id) => { $(id).open = false; $(id).querySelector("summary").focus(); };
$("split").onclick = () => { setFormat("side-by-side"); closeMenu("settings"); };
$("unified").onclick = () => { setFormat("line-by-line"); closeMenu("settings"); };
function setTests(hide) {
  view.hideTests = hide;
  localStorage.setItem("prr-tests", hide ? "1" : "0");
  const n = files.filter((_, fi) => isTest(fi)).length;
  $("tests").hidden = $("tests-sep").hidden = !n;
  $("test-count").textContent = `${n} test ${n === 1 ? "file" : "files"}`;
  $("tests").setAttribute("aria-checked", hide);
  renderTree();
  applyFiles();
}
$("tests").onclick = () => { setTests(!view.hideTests); closeMenu("settings"); };
// A failed start opens the settings menu, where the model error shows next to the model selects.
async function analyzeNow() {
  try {
    await api(`/api/analyze?${q}`, { method: "POST", body: JSON.stringify(selectedModels()) });
    $("settings").open = false;
  } catch (error) {
    $("model-error").textContent = error.message;
    $("settings").open = true;
  }
}
$("rerun").onclick = analyzeNow;
const ANALYZE_PROMPT = `<div class="analyze-prompt"><p class="mb-3">This pull request has no analysis yet.</p><button class="btn btn-primary analyze-now" type="button">Analyze</button></div>`;
document.addEventListener("click", (e) => { if (e.target.closest(".analyze-now")) analyzeNow(); });
const saveWarning = () => state.saveError ? `<div class="flash flash-error" role="alert">${esc(state.saveError)} <button type="button" class="btn btn-sm retry-save">Retry save</button></div>` : "";
document.addEventListener("click", async (e) => {
  const button = e.target.closest(".retry-save");
  if (!button) return;
  button.disabled = true;
  try { await api(`/api/save?${q}`, { method: "POST" }); state.saveError = null; }
  catch (error) { state.saveError = error.message; }
  finally { renderReview(); queueLayout(); }
});

const sizeVar = () => {
  document.documentElement.style.setProperty("--sh", $("scroller").clientHeight + "px");
  document.documentElement.style.setProperty("--th", $("tabs").offsetHeight + "px");
};
new ResizeObserver(() => { sizeVar(); state && queueLayout(); }).observe($("scroller"));

// Saved reviews: the menu lists every saved review; opening one reloads the page with its key.
const inst = new URLSearchParams(location.search).get("inst");
const go = (k) => {
  const p = new URLSearchParams();
  if (k) p.set("key", k);
  if (inst) p.set("inst", inst);
  location.search = p;
};
// An old canvas server (loaded before these endpoints existed) answers with plain text, not JSON.
const api = async (path, init) => {
  const r = await fetch(path, init).catch(() => {
    throw new Error("The canvas server is not running. Close this canvas and open it again.");
  });
  const text = await r.text();
  let v;
  try { v = JSON.parse(text); } catch {
    throw new Error(r.status === 404 ? "This canvas runs an old version of the extension. Open the canvas in a new session." : text || `The request failed (${r.status}).`);
  }
  if (!r.ok) throw new Error(v.error ?? `The request failed (${r.status}).`);
  return v;
};
const openReview = async (body) => go((await api("/api/open", { method: "POST", body: JSON.stringify({ ...body, instance: inst }) })).key);
let catalog = [], modelLoadError = "";
const modelSelects = { reviewModel: $("review-model"), hunkModel: $("hunk-model") };
const selectedModels = () => {
  if (modelLoadError) throw new Error(modelLoadError);
  return validateModels(catalog, Object.fromEntries(Object.entries(modelSelects).map(([role, el]) => [role, el.value])));
};
function refreshModels() {
  for (const [role, el] of Object.entries(modelSelects)) {
    const selected = el.value;
    const choices = modelChoices(catalog, role, selected);
    el.innerHTML = (choices.some((m) => m.id === selected) ? "" : `<option value="${esc(selected)}" disabled>${esc(selected || "Choose a model")} — unavailable</option>`)
      + choices.map((m) => `<option value="${esc(m.id)}">${esc(m.name ?? m.id)}</option>`).join("");
    el.value = selected;
  }
  for (const el of [...chatEls.values(), ...findingChats.values(), ...hunkChats.values()]) {
    fillChatModel(el.querySelector("select"), el.querySelector("select").value);
    updateChat(el, el.thread);
  }
  try { selectedModels(); $("model-error").textContent = ""; }
  catch (error) { $("model-error").textContent = error.message; }
}
async function loadModels() {
  try {
    const result = await api("/api/models");
    catalog = result.models;
    for (const [role, el] of Object.entries(modelSelects)) {
      const selected = localStorage.getItem(`prr-${role}`) ?? state?.models?.[role] ?? result.defaults[role];
      el.innerHTML = `<option value="${esc(selected)}">${esc(selected)}</option>`;
      el.disabled = false;
      el.onchange = () => { localStorage.setItem(`prr-${role}`, el.value); refreshModels(); };
    }
    refreshModels();
  } catch (error) {
    modelLoadError = `Cannot load models: ${error.message}`;
    $("model-error").textContent = modelLoadError;
    for (const el of [...chatEls.values(), ...findingChats.values(), ...hunkChats.values()]) updateChat(el, el.thread);
  }
}
document.querySelectorAll(".new-review").forEach((form) => {
  form.onsubmit = async (e) => {
    e.preventDefault();
    const err = form.nextElementSibling, btn = form.querySelector("button");
    btn.disabled = true;
    btn.textContent = "Starting…";
    err.hidden = true;
    try { await openReview({ pr: form.pr.value, ...selectedModels() }); } catch (x) {
      err.textContent = x.message;
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = "Start review";
    }
  };
});

const when = (t) => new Date(t).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const reviewStatus = (r) => r.status === "running" ? "Analyzing" : r.status === "error" ? "Failed" : r.status === "idle" ? "Not analyzed"
  : `${r.findings} ${r.findings === 1 ? "finding" : "findings"}`;
async function renderReviews() {
  let list;
  try { list = await api("/api/reviews"); } catch (x) {
    $("review-list").innerHTML = `<div class="SelectMenu-blankslate color-fg-danger">${esc(x.message)}</div>`;
    return;
  }
  $("review-count").textContent = list.length || "";
  $("review-list").innerHTML = list.length ? list.map((r) => {
    const current = r.key === key && (!r.file || !state?.file || r.file === state.file);
    const del = r.file ? `<button class="review-delete btn-octicon" type="button" data-file="${esc(r.file)}" aria-label="Delete the saved review of ${esc(r.key ?? r.file)}">${ICON.trash}</button>` : "";
    if (r.error) return `<div class="review-item"><span class="min-width-0 flex-1 p-2"><b>${esc(r.title)}</b><span class="d-block f6 color-fg-danger">${esc(r.error)}</span></span>${del}</div>`;
    return `<div class="review-item" role="menuitemradio" aria-checked="${current}">`
      + `<button class="review-open" type="button" data-key="${esc(r.key)}" data-file="${esc(r.file ?? "")}">${ICON.check}<span class="min-width-0 flex-1">`
      + `<span class="name">${esc(r.title)}</span><span class="d-block f6 color-fg-muted">${esc(r.key)} · ${reviewStatus(r)} · ${when(r.updatedAt)}</span></span></button>`
      + del
      + `</div>`;
  }).join("") : `<div class="SelectMenu-blankslate">There are no saved reviews.</div>`;
}
$("review-list").addEventListener("click", async (e) => {
  const open = e.target.closest(".review-open"), del = e.target.closest(".review-delete");
  if (open) return open.dataset.file ? openReview({ file: open.dataset.file }).catch((x) => alert(x.message)) : go(open.dataset.key);
  if (!del) return;
  // Two clicks delete: the first click changes the icon to a "Delete" button.
  if (!del.dataset.armed) {
    del.dataset.armed = "1";
    del.className = "review-delete btn btn-sm btn-danger";
    del.textContent = "Delete";
    return;
  }
  try { await api(`/api/reviews?file=${encodeURIComponent(del.dataset.file)}`, { method: "DELETE" }); } catch (x) {
    del.textContent = x.message;
    return;
  }
  if (del.dataset.file === state?.file) return go(null);
  renderReviews();
});
$("reviews-icon").outerHTML = ICON.pr;
$("reviews").addEventListener("toggle", () => {
  if (!$("reviews").open) return;
  renderReviews();
  $("reviews").querySelector("input").focus();
});
$("settings-icon").outerHTML = ICON.gear;
$("stack-icon").outerHTML = ICON.stack;
$("stack-close").outerHTML = ICON.x;
$("rerun-icon").outerHTML = ICON.sync.replace('class="octicon"', 'class="octicon SelectMenu-icon"');
const menus = ["reviews", "stack", "settings"].map($);
document.addEventListener("click", (e) => { for (const m of menus) if (m.open && !e.composedPath().includes(m)) m.open = false; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") for (const m of menus) if (m.open) closeMenu(m.id); });
$("settings").addEventListener("toggle", () => { if ($("settings").open) $("settings").querySelector('[aria-checked="true"]:not([hidden]), select')?.focus(); });
$("stack").querySelector(".SelectMenu-closeButton").onclick = () => closeMenu("stack");

// Stacked PRs: the menu lists layers top first. Moving to a layer opens its review without a new analysis.
const repo = key?.split("#")[0], here = +key?.split("#")[1];
const STATE_ICON = { OPEN: ICON.pr, DRAFT: ICON.draft, MERGED: ICON.merged, CLOSED: ICON.closed };
const STATE_NAME = { OPEN: "Open", DRAFT: "Draft", MERGED: "Merged", CLOSED: "Closed" };
const layers = () => [...(state?.stack?.entries ?? [])].sort((a, b) => b.position - a.position);
function renderStack() {
  const s = state.stack;
  $("stack").hidden = !s;
  if (!s) return;
  const all = layers(), cur = all.find((x) => x.number === here);
  $("stack-pos").textContent = cur ? `${cur.position}/${all.length}` : all.length;
  $("stack").querySelector("summary").setAttribute("aria-label", cur ? `Stack #${s.number}, pull request ${cur.position} of ${all.length}` : `Stack #${s.number}`);
  $("stack-title").textContent = `Stack #${s.number}`;
  $("stack-list").innerHTML = all.map((x) => `<button class="SelectMenu-item stack-item" type="button" role="menuitem" data-num="${x.number}"${x.number === here ? ' aria-current="page"' : ""} title="${esc(x.title)}">`
    + STATE_ICON[x.state].replace('class="octicon"', `class="octicon s-${x.state}" role="img" aria-label="${STATE_NAME[x.state]}"`).replace(' aria-hidden="true"', "")
    + `<span><b>${esc(x.title)}</b><small>#${x.number} · ${esc(x.head)}</small></span></button>`).join("")
    + `<div class="stack-base"><i aria-hidden="true"></i><code>${esc(s.base)}</code></div>`;
}
async function openLayer(num) {
  if (!num || num === here) return;
  let models = {};
  try { models = selectedModels(); } catch {}
  $("stack-error").textContent = "";
  $("stack-list").setAttribute("aria-busy", "true");
  try { await openReview({ pr: `${repo}#${num}`, analyze: false, ...models }); }
  catch (x) { $("stack-error").textContent = x.message; $("stack").open = true; $("stack-list").removeAttribute("aria-busy"); }
}
$("stack-list").onclick = (e) => openLayer(+e.target.closest(".stack-item")?.dataset.num);
$("stack").addEventListener("toggle", () => { if ($("stack").open) $("stack-list").querySelector('[aria-current="page"], .stack-item')?.focus(); });
// Shift+J moves down the stack (toward the base), Shift+K moves up.
document.addEventListener("keydown", (e) => {
  const d = { J: -1, K: 1 }[e.key];
  if (!d || !state?.stack || !e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target instanceof Element && e.target.closest("input, textarea, select, [contenteditable]")) return;
  const cur = layers().find((x) => x.number === here);
  const next = cur && layers().find((x) => x.position === cur.position + d);
  if (next) { e.preventDefault(); openLayer(next.number); }
});

const res = key ? await fetch(`/api/state?${q}`) : null;
if (!res?.ok) {
  $("app").classList.add("empty");
  $("title").textContent = "PR Review";
  if (key) $("empty-note").textContent = `The review of ${key} is not loaded. Start the review again, or open a saved review from Reviews.`;
  if (key) $("empty").querySelector("input").value = key;
  renderReviews();
} else {
state = await res.json();
files = state.files;
setTab(localStorage.getItem("prr-tab") ?? "review");
setTree(localStorage.getItem("prr-tree") !== "0");
for (const pane of ["left", "tree"]) { const w = localStorage.getItem("prr-w-" + pane); if (w) setPane(pane, +w); }
renderHeader();
renderStack();
renderReview();
renderTree();
setFormat(view.format);
setTests(view.hideTests);

let lastReview = JSON.stringify([state.review, state.error, state.saveError, state.status]);
new EventSource(`/api/events?${q}`).onmessage = (e) => {
  Object.assign(state, JSON.parse(e.data));
  renderHeader();
  const review = JSON.stringify([state.review, state.error, state.saveError, state.status]);
  if (review !== lastReview) { lastReview = review; renderReview(); renderTree(); }
  queueLayout();
};
renderReviews();
}
await loadModels();
</script>
